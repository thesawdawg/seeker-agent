[project]
name = "SEEKER"
version = "1.0.0"
description = "Multi-agent deep research intelligence pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "requests>=2.31.0",
    "arxiv>=2.1.0",
]

[project.optional-dependencies]
consensus = ["mcp>=1.20.0"]
# Only tools/eval_claims.py and tools/eval_references.py need the SDK.
anthropic = ["anthropic>=0.40.0"]
dev = ["pytest>=7.0"]

[project.scripts]
seeker = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Scenario scripts run as subprocesses via tests/test_scenarios.py — collecting
# them directly would import them into one process, where they overwrite each
# other's module-level DB_PATH.
norecursedirs = ["tests/scenarios"]
