[project]
name = "SEEKER"
version = "1.0.0"
description = "Multi-agent deep research intelligence pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "requests>=2.31.0",
    "arxiv>=2.1.0",
]

[project.optional-dependencies]
consensus = ["mcp>=1.20.0"]
mysql = ["PyMySQL>=1.1.0"]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
]
# Only tools/eval_claims.py and tools/eval_references.py need the SDK.
anthropic = ["anthropic>=0.40.0"]
dev = ["pytest>=7.0", "httpx>=0.27.0"]

[project.scripts]
seeker = "main:main"

# Package discovery, stated rather than guessed.
#
# This is a flat layout with several non-package top-level directories
# (db/, logs/, artifacts/, exports/, review/), and setuptools refuses to
# auto-discover in that situation — it errors with "Multiple top-level
# packages discovered in a flat-layout" rather than risk shipping the
# database and run artifacts inside a wheel. Keep the intended packages
# explicit even though uv currently runs the application directly from source.
#
# tools/ is deliberately absent: those are standalone scripts run with
# `python3 tools/<name>.py`, not an importable package (no __init__.py).
[tool.setuptools]
packages = ["core", "agents", "web"]
py-modules = ["main", "worker"]      # main:main backs the `seeker` entry point

[tool.setuptools.package-data]
web = [
    "static/*",
    "static/js/*.js",
    "static/js/core/*.js",
    "static/js/components/*.js",
    "static/js/features/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Scenario scripts run as subprocesses via tests/test_scenarios.py — collecting
# them directly would import them into one process, where they overwrite each
# other's module-level DB_PATH.
norecursedirs = ["tests/scenarios"]
