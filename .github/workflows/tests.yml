name: tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: pytest (sqlite, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor in pyproject.toml; 3.12 catches the deprecations
        # that will become errors before it moves.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

  mysql:
    # The MySQL dialect is what the Docker deployment runs on, and its tests
    # skip themselves without a server — so locally they have never run.
    name: pytest (mysql)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: seeker_test
          MYSQL_USER: seeker
          MYSQL_PASSWORD: seeker
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -prootpw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[dev]'

      - name: Run tests
        # SEEKER_TEST_MYSQL_URL is the variable tests/test_mysql_backend.py
        # actually gates on. SEEKER_DB_BACKEND is deliberately *not* forced to
        # mysql: the rest of the suite builds throwaway SQLite databases and
        # expects that to be the ambient default, so forcing it here would
        # break those tests without exercising anything extra.
        run: pytest -q -rs
        env:
          SEEKER_TEST_MYSQL_URL: mysql://seeker:seeker@127.0.0.1:3306/seeker_test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t seeker:ci .
